services:
  - type: web
    name: 3gpp-rag-api
    runtime: python

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: FRONTEND_URL
        sync: false

      - key: PYTHON_VERSION
        value: "3.11"
